<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Engagement Tracker</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#4F46E5',
                        brandPink: '#EC4899',
                        brandYellow: '#FBBF24',
                    },
                    animation: {
                        blob: "blob 7s infinite",
                        spinFast: "pulse 0.3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #F8FAFC; 
            color: #334155; 
            overflow-x: hidden;
        }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-animated {
            background: linear-gradient(-45deg, #FF9A9E, #FECFEF, #A1C4FD, #C2E9FB);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #4F46E5;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [teacherName, setTeacherName] = useState(localStorage.getItem('tracker_teacher_name') || '');
            const [view, setView] = useState(teacherName ? 'setup' : 'login'); 
            const [sessions, setSessions] = useState([]);
            const [currentSession, setCurrentSession] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('engagement_sessions_v4');
                if (saved) setSessions(JSON.parse(saved));
            }, []);

            const saveSessions = (newSessions) => {
                setSessions(newSessions);
                localStorage.setItem('engagement_sessions_v4', JSON.stringify(newSessions));
            };

            const handleLogin = (name) => {
                setTeacherName(name);
                localStorage.setItem('tracker_teacher_name', name);
                setView('setup');
            };

            const handleLogout = () => {
                setTeacherName('');
                localStorage.removeItem('tracker_teacher_name');
                setView('login');
            };

            const startSession = (sessionData) => {
                const newSession = {
                    id: Date.now().toString(),
                    ...sessionData,
                    date: new Date().toLocaleDateString('th-TH'),
                    students: sessionData.studentList.map(name => ({
                        id: Math.random().toString(36).substr(2, 9),
                        name: name.trim(),
                        score: 0,
                        events: [],
                        isSilent: false,
                        attended: false,
                        flagged: false,
                        note: ''
                    })),
                    elapsed: 0
                };
                setCurrentSession(newSession);
                setView('tracker');
            };

            const updateSession = (updatedSession) => {
                setCurrentSession(updatedSession);
                const filtered = sessions.filter(s => s.id !== updatedSession.id);
                saveSessions([...filtered, updatedSession]);
            };

            if (view === 'login') {
                return <LoginView onLogin={handleLogin} />;
            }

            return (
                <div className="min-h-screen p-4 flex flex-col bg-slate-50 relative">
                    <nav className="relative z-20 flex flex-wrap justify-between items-center mb-6 bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-sm border border-white gap-4">
                        <div className="flex items-center gap-3">
                            <img src={`https://api.dicebear.com/7.x/bottts/svg?seed=${teacherName}&backgroundColor=b6e3f4`} alt="Avatar" className="w-12 h-12 rounded-full border-2 border-brandBlue shadow-sm" />
                            <div>
                                <h1 className="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brandBlue to-brandPink leading-tight">Live Engagement</h1>
                                <p className="text-xs font-bold text-slate-500">ครู {teacherName}</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setView('setup')} className={`px-4 py-2 rounded-2xl text-sm font-bold transition-all duration-300 ${view === 'setup' ? 'bg-gradient-to-r from-brandBlue to-purple-500 text-white shadow-lg translate-y-[-2px]' : 'bg-white hover:bg-slate-50 text-slate-600 border border-slate-200'}`}>🚀 คาบใหม่</button>
                            <button onClick={() => setView('history')} className={`px-4 py-2 rounded-2xl text-sm font-bold transition-all duration-300 ${view === 'history' ? 'bg-gradient-to-r from-brandBlue to-purple-500 text-white shadow-lg translate-y-[-2px]' : 'bg-white hover:bg-slate-50 text-slate-600 border border-slate-200'}`}>🗓 ประวัติ</button>
                            <button onClick={() => setView('tracking')} className={`px-4 py-2 rounded-2xl text-sm font-bold transition-all duration-300 ${view === 'tracking' ? 'bg-gradient-to-r from-brandBlue to-purple-500 text-white shadow-lg translate-y-[-2px]' : 'bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 flex items-center gap-1'}`}>📈 ติดตามผู้เรียน</button>
                            <button onClick={handleLogout} className="px-4 py-2 rounded-2xl text-sm font-bold bg-red-50 hover:bg-red-100 text-red-500 transition-all">ออก</button>
                        </div>
                    </nav>

                    <div className="flex-1 relative z-10">
                        {view === 'setup' && <SetupView onStart={startSession} />}
                        {view === 'tracker' && <TrackerView session={currentSession} updateSession={updateSession} onEnd={() => setView('summary')} />}
                        {view === 'summary' && <SummaryView session={currentSession} />}
                        {view === 'history' && <HistoryView sessions={sessions} onViewSession={(s) => { setCurrentSession(s); setView('summary'); }} />}
                        {view === 'tracking' && <TrackingView sessions={sessions} />}
                    </div>
                </div>
            );
        }

        function LoginView({ onLogin }) {
            const [name, setName] = useState('');
            const onSubmit = (e) => { e.preventDefault(); if (name.trim()) onLogin(name.trim()); };
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-animated p-4 overflow-hidden">
                    <div className="bg-white/80 backdrop-blur-xl p-10 rounded-[3rem] shadow-[0_20px_50px_rgba(8,_112,_184,_0.2)] w-full max-w-md text-center border border-white transform transition-all duration-500 hover:scale-105">
                        <div className="relative inline-block mb-6">
                            <div className="absolute inset-0 bg-gradient-to-r from-brandBlue to-brandPink rounded-full blur-xl opacity-40 animate-pulse"></div>
                            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=SuperTeacher&backgroundColor=b6e3f4" alt="Teacher" className="relative w-40 h-40 mx-auto rounded-full border-4 border-white shadow-xl bg-blue-50" />
                        </div>
                        <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brandBlue to-brandPink mb-3">เริ่มชั้นเรียนสนุกๆ!</h1>
                        <p className="text-slate-500 mb-8 font-medium">เข้าสู่ระบบเพื่อบันทึกและติดตามผู้เรียน</p>
                        <form onSubmit={onSubmit}>
                            <input type="text" placeholder="พิมพ์ชื่อคุณครูที่นี่..." value={name} onChange={e => setName(e.target.value)} className="w-full p-4 mb-5 rounded-2xl glass-input text-center text-xl font-bold text-slate-700 outline-none" required />
                            <button type="submit" className="w-full py-4 bg-gradient-to-r from-brandBlue via-purple-500 to-brandPink text-white font-extrabold rounded-2xl text-xl shadow-[0_10px_25px_rgba(236,72,153,0.3)] active:scale-95 flex items-center justify-center gap-2"><span>เข้าสู่ระบบ</span><span className="text-2xl">✨</span></button>
                        </form>
                    </div>
                </div>
            );
        }

        function SetupView({ onStart }) {
            const [subject, setSubject] = useState('วิทยาการคำนวณ');
            const [grade, setGrade] = useState('ป.4/1');
            const [topic, setTopic] = useState('การเขียนโปรแกรมเบื้องต้น');
            const [studentsInput, setStudentsInput] = useState('ด.ช. สมชาย รักเรียน\nด.ญ. สมหญิง ตั้งใจ\nด.ช. มานะ อดทน\nด.ญ. ปิติ มีสุข\nด.ช. วีระ กล้าหาญ');

            const handleStart = () => {
                const studentList = studentsInput.split('\n').filter(s => s.trim() !== '');
                if (studentList.length === 0 || !subject || !grade) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');
                onStart({ subject, grade, topic, studentList });
            };

            return (
                <div className="max-w-5xl mx-auto relative mt-4 md:mt-10">
                    <div className="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
                    <div className="absolute top-0 -right-4 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style={{ animationDelay: "2s" }}></div>
                    <div className="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob" style={{ animationDelay: "4s" }}></div>

                    <div className="relative bg-white/70 backdrop-blur-2xl p-8 md:p-12 rounded-[3rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-2 border-white z-10">
                        <div className="text-center mb-10">
                            <div className="inline-block p-4 bg-gradient-to-br from-yellow-200 to-yellow-400 rounded-3xl shadow-lg mb-4 transform -rotate-6"><span className="text-5xl">🎨</span></div>
                            <h2 className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brandBlue via-purple-600 to-brandPink mb-2">เตรียมความพร้อมก่อนเริ่มคาบ</h2>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                            <div className="space-y-5 bg-white/50 p-6 rounded-3xl border border-white shadow-sm">
                                <div>
                                    <label className="block text-sm font-extrabold mb-2 text-brandBlue flex items-center gap-2">📚 ชื่อวิชา</label>
                                    <input type="text" value={subject} onChange={e => setSubject(e.target.value)} className="w-full p-4 rounded-2xl glass-input text-slate-700 font-medium"/>
                                </div>
                                <div>
                                    <label className="block text-sm font-extrabold mb-2 text-purple-600 flex items-center gap-2">🏫 ระดับชั้น / ห้อง</label>
                                    <input type="text" value={grade} onChange={e => setGrade(e.target.value)} className="w-full p-4 rounded-2xl glass-input text-slate-700 font-medium"/>
                                </div>
                                <div>
                                    <label className="block text-sm font-extrabold mb-2 text-brandPink flex items-center gap-2">🎯 หัวข้อที่สอน / กิจกรรม</label>
                                    <input type="text" value={topic} onChange={e => setTopic(e.target.value)} className="w-full p-4 rounded-2xl glass-input text-slate-700 font-medium"/>
                                </div>
                            </div>
                            <div className="flex flex-col bg-white/50 p-6 rounded-3xl border border-white shadow-sm">
                                <label className="block text-sm font-extrabold mb-2 text-slate-700 flex justify-between items-center">
                                    <span className="flex items-center gap-2 text-emerald-600">👥 รายชื่อนักเรียน (คนละ 1 บรรทัด)</span>
                                    <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-xl text-xs font-bold">วางจาก Excel ได้ ✨</span>
                                </label>
                                <textarea value={studentsInput} onChange={e => setStudentsInput(e.target.value)} className="flex-1 w-full p-5 rounded-2xl glass-input text-slate-700 font-medium resize-none leading-relaxed"></textarea>
                            </div>
                        </div>
                        <button onClick={handleStart} className="w-full py-5 bg-gradient-to-r from-brandBlue via-indigo-500 to-purple-600 text-white font-extrabold rounded-[2rem] text-2xl shadow-[0_15px_30px_rgba(79,70,229,0.3)] active:scale-95 flex items-center justify-center gap-3">
                            🚀 ลุยกันเลย! เริ่มบันทึกการสอน
                        </button>
                    </div>
                </div>
            );
        }

        function TrackerView({ session, updateSession, onEnd }) {
            const [search, setSearch] = useState('');
            const [time, setTime] = useState(session.elapsed || 0);
            const [isRunning, setIsRunning] = useState(true);
            
            // Randomizer State
            const [randomStudent, setRandomStudent] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);
            const [noteModal, setNoteModal] = useState({ open: false, studentId: null, text: '' });

            useEffect(() => {
                let interval;
                if (isRunning) interval = setInterval(() => setTime(t => t + 1), 1000);
                return () => clearInterval(interval);
            }, [isRunning]);

            useEffect(() => {
                if (time % 5 === 0 && time !== 0) updateSession({ ...session, elapsed: time });
            }, [time]);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const handleEvent = (studentId, type, points) => {
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                const updatedStudents = session.students.map(s => {
                    if (s.id === studentId) {
                        return {
                            ...s,
                            score: s.score + points,
                            events: [{ type, time: timeStr, points }, ...s.events],
                            isSilent: type === 'เงียบ' ? true : false,
                            attended: type === 'เข้าเรียน' ? true : s.attended
                        };
                    }
                    return s;
                });
                updateSession({ ...session, students: updatedStudents });
            };

            const toggleFlag = (studentId) => {
                const updatedStudents = session.students.map(s => s.id === studentId ? { ...s, flagged: !s.flagged } : s);
                updateSession({ ...session, students: updatedStudents });
            };

            const saveNote = () => {
                const updatedStudents = session.students.map(s => s.id === noteModal.studentId ? { ...s, note: noteModal.text } : s);
                updateSession({ ...session, students: updatedStudents });
                setNoteModal({ open: false, studentId: null, text: '' });
            };

            const openNoteModal = (student) => {
                setNoteModal({ open: true, studentId: student.id, text: student.note || '' });
            };

            const triggerRandomizer = () => {
                if (session.students.length === 0) return;
                setIsSpinning(true);
                setRandomStudent(null);
                
                let counter = 0;
                const intervalId = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * session.students.length);
                    setRandomStudent(session.students[randomIndex]);
                    counter++;
                    
                    if (counter > 20) { // หมุนนานขึ้นนิดนึงให้ลุ้น
                        clearInterval(intervalId);
                        setIsSpinning(false);
                    }
                }, 70); 
            };

            const filteredStudents = session.students.filter(s => s.name.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="flex flex-col h-[85vh] relative">
                    
                    {/* 🎲 Randomizer Question Modal (อัปเกรดใหม่!) */}
                    {randomStudent && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center z-50 p-4">
                            <div className={`bg-white p-10 rounded-[3rem] shadow-2xl text-center max-w-lg w-full border-4 transform transition-all duration-300 ${isSpinning ? 'border-brandPink scale-95' : 'border-brandBlue scale-100'}`}>
                                
                                <div className="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-brandBlue to-brandPink text-white px-6 py-2 rounded-full font-bold text-xl shadow-lg border-4 border-white">
                                    {isSpinning ? '🎲 กำลังสุ่มผู้โชคดี...' : '🎯 ได้เวลาตอบคำถาม!'}
                                </div>

                                <div className={`text-4xl md:text-5xl font-extrabold my-8 py-10 rounded-[2rem] transition-all duration-200 ${isSpinning ? 'text-white bg-gradient-to-r from-brandBlue via-purple-500 to-brandPink animate-spinFast shadow-inner' : 'text-brandBlue bg-blue-50 shadow-[0_10px_20px_rgba(79,70,229,0.2)] scale-105'}`}>
                                    {randomStudent.name}
                                </div>
                                
                                {!isSpinning ? (
                                    <div className="animate-fade-in-up">
                                        <p className="text-slate-500 font-medium mb-6">คุณครูสามารถให้คะแนนได้ทันทีเลยครับ!</p>
                                        <div className="grid grid-cols-2 gap-4 mb-6">
                                            <button onClick={() => { handleEvent(randomStudent.id, 'ตอบคำถาม', 2); setRandomStudent(null); }} className="p-5 bg-gradient-to-b from-emerald-100 to-emerald-200 text-emerald-800 font-extrabold rounded-2xl hover:from-emerald-200 hover:to-emerald-300 active:scale-95 transition-transform flex flex-col items-center gap-2 border-2 border-emerald-300 shadow-md">
                                                <span className="text-4xl">🙋‍♂️</span>
                                                <span className="text-lg">ตอบคำถาม (+2)</span>
                                            </button>
                                            <button onClick={() => { handleEvent(randomStudent.id, 'เงียบ', 0); setRandomStudent(null); }} className="p-5 bg-slate-100 text-slate-500 font-bold rounded-2xl hover:bg-red-100 hover:text-red-600 hover:border-red-300 active:scale-95 transition-all flex flex-col items-center gap-2 border-2 border-slate-200">
                                                <span className="text-4xl">💤</span>
                                                <span className="text-lg">ตอบไม่ได้ / เงียบ</span>
                                            </button>
                                        </div>
                                        <button onClick={() => setRandomStudent(null)} className="w-full p-4 text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-2xl font-bold transition-colors border-2 border-transparent hover:border-slate-200">
                                            ❌ ปิดหน้าต่าง (ไม่ให้คะแนน)
                                        </button>
                                    </div>
                                ) : (
                                    <div className="h-40 flex items-center justify-center">
                                        <div className="animate-spin text-7xl drop-shadow-lg">🌟</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Note Modal */}
                    {noteModal.open && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-sm">
                                <h3 className="text-lg font-bold text-slate-700 mb-2">📝 บันทึกพฤติกรรม</h3>
                                <p className="text-sm text-slate-500 mb-4">สำหรับ: {session.students.find(s => s.id === noteModal.studentId)?.name}</p>
                                <textarea value={noteModal.text} onChange={(e) => setNoteModal({...noteModal, text: e.target.value})} className="w-full p-4 border-2 border-slate-200 rounded-xl bg-slate-50 focus:border-brandBlue focus:bg-white outline-none mb-4 resize-none h-24" placeholder="เช่น วันนี้ดูไม่ค่อยสบาย, ตั้งใจเรียนมากเป็นพิเศษ..."></textarea>
                                <div className="flex gap-2">
                                    <button onClick={() => setNoteModal({ open: false, studentId: null, text: '' })} className="flex-1 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl">ยกเลิก</button>
                                    <button onClick={saveNote} className="flex-1 py-2 bg-brandBlue text-white font-bold rounded-xl">บันทึก</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Control Bar */}
                    <div className="flex flex-wrap gap-4 justify-between items-center bg-white p-4 rounded-3xl shadow-sm border border-slate-100 mb-4">
                        <div className="flex items-center gap-4">
                            <div className="bg-slate-800 text-white px-5 py-2.5 rounded-2xl text-3xl font-mono font-bold">{formatTime(time)}</div>
                            <button onClick={() => setIsRunning(!isRunning)} className={`px-5 py-3 rounded-2xl font-bold text-white shadow-md active:scale-95 ${isRunning ? 'bg-brandYellow text-yellow-900' : 'bg-green-500'}`}>
                                {isRunning ? '⏸ พัก' : '▶ เริ่มต่อ'}
                            </button>
                        </div>
                        <div className="flex-1 max-w-md flex gap-2">
                            <div className="relative flex-1">
                                <span className="absolute left-4 top-3 text-slate-400">🔍</span>
                                <input type="text" placeholder="ค้นหาชื่อ..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-12 pr-4 py-3 border-2 border-slate-100 rounded-2xl bg-slate-50 focus:bg-white focus:border-brandBlue focus:outline-none font-medium" />
                            </div>
                            
                            {/* ปุ่มสุ่มชื่อที่อัปเกรดแล้ว! */}
                            <button onClick={triggerRandomizer} className="px-6 py-3 bg-gradient-to-r from-purple-500 to-brandPink hover:from-purple-600 hover:to-pink-600 text-white font-extrabold rounded-2xl shadow-lg shadow-pink-200 transition-transform active:scale-95 flex items-center gap-2 whitespace-nowrap border-2 border-white">
                                <span className="text-2xl animate-bounce">🎲</span> สุ่มชื่อตอบคำถาม
                            </button>

                        </div>
                        <button onClick={() => { setIsRunning(false); onEnd(); }} className="px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-2xl shadow-md active:scale-95">⏹ จบคาบเรียน</button>
                    </div>

                    {/* Student Grid */}
                    <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto hide-scroll pb-10">
                        {filteredStudents.map(student => (
                            <div key={student.id} className={`bg-white rounded-[1.5rem] p-4 border-2 shadow-sm transition-all flex flex-col relative ${student.flagged ? 'border-orange-400 shadow-orange-100' : student.isSilent ? 'border-red-300 bg-red-50/50' : 'border-slate-100 hover:border-brandBlue'}`}>
                                
                                <div className="flex justify-between items-start mb-3">
                                    <div className="font-bold text-lg text-slate-800 truncate pr-2 w-3/5" title={student.name}>{student.name}</div>
                                    <div className="flex gap-1">
                                        <button onClick={() => toggleFlag(student.id)} title="ปักหมุด/เฝ้าระวัง" className={`p-1.5 rounded-lg transition-colors ${student.flagged ? 'bg-orange-100 text-orange-600' : 'bg-slate-50 text-slate-300 hover:bg-slate-200 hover:text-slate-500'}`}>🚩</button>
                                        <button onClick={() => openNoteModal(student)} title="จดโน้ต" className={`p-1.5 rounded-lg transition-colors ${student.note ? 'bg-blue-100 text-blue-600' : 'bg-slate-50 text-slate-300 hover:bg-slate-200 hover:text-slate-500'}`}>📝</button>
                                        <div className="bg-slate-100 text-brandBlue font-extrabold px-2 py-1 rounded-lg text-sm border border-slate-200 ml-1">{student.score}</div>
                                    </div>
                                </div>

                                {!student.attended ? (
                                    <button onClick={() => handleEvent(student.id, 'เข้าเรียน', 1)} className="w-full mb-3 py-2 bg-gradient-to-r from-emerald-400 to-green-500 text-white rounded-xl font-bold shadow-sm active:scale-95 text-sm">👋 เช็คชื่อเข้าเรียน (+1)</button>
                                ) : (
                                    <div className="w-full mb-3 py-1.5 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-xs flex items-center justify-center gap-1 border border-emerald-100">✅ มาเรียนแล้ว</div>
                                )}
                                
                                <div className="grid grid-cols-2 gap-2 mt-auto">
                                    <button onClick={() => handleEvent(student.id, 'ตอบคำถาม', 2)} className="flex flex-col items-center justify-center p-2 bg-blue-50 text-blue-700 rounded-xl active:scale-95"><span className="text-xl mb-1">🙋‍♂️</span><span className="text-[10px] font-bold">ตอบคำถาม (+2)</span></button>
                                    <button onClick={() => handleEvent(student.id, 'แชท', 1)} className="flex flex-col items-center justify-center p-2 bg-indigo-50 text-indigo-700 rounded-xl active:scale-95"><span className="text-xl mb-1">💬</span><span className="text-[10px] font-bold">พิมพ์แชท (+1)</span></button>
                                    <button onClick={() => handleEvent(student.id, 'กิจกรรม', 2)} className="flex flex-col items-center justify-center p-2 bg-purple-50 text-purple-700 rounded-xl active:scale-95"><span className="text-xl mb-1">🎯</span><span className="text-[10px] font-bold">กิจกรรม (+2)</span></button>
                                    <button onClick={() => handleEvent(student.id, 'เงียบ', 0)} className="flex flex-col items-center justify-center p-2 bg-slate-50 text-slate-500 hover:text-red-600 rounded-xl active:scale-95"><span className="text-xl mb-1">💤</span><span className="text-[10px] font-bold">เงียบ (0)</span></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 4. Summary View
        function SummaryView({ session }) {
            if (!session) return null;
            const sortedStudents = [...session.students].sort((a, b) => b.score - a.score);
            return (
                <div className="max-w-4xl mx-auto bg-white p-8 rounded-[3rem] shadow-xl border border-slate-100 mt-4">
                    <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brandBlue to-purple-600 mb-6">📊 สรุปผล: {session.subject} ({session.grade})</h2>
                    <div className="space-y-3">
                        {sortedStudents.map((s, index) => (
                            <div key={s.id} className="flex items-center gap-4 bg-white border border-slate-100 p-4 rounded-2xl">
                                <div className="w-10 h-10 flex items-center justify-center font-bold rounded-full bg-slate-100 text-slate-500">{index + 1}</div>
                                <div className="w-48 font-bold text-slate-700">{s.name}</div>
                                <div className="flex-1 text-sm text-slate-500">
                                    {s.flagged && <span className="text-orange-500 mr-2" title="ถูกปักหมุด">🚩</span>}
                                    {s.note && <span className="text-blue-500 text-xs bg-blue-50 px-2 py-1 rounded-md">📝 {s.note}</span>}
                                </div>
                                <div className="w-20 text-right font-extrabold text-brandBlue text-xl">{s.score} <span className="text-sm font-normal">pt</span></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 5. History View
        function HistoryView({ sessions, onViewSession }) {
            return (
                <div className="max-w-4xl mx-auto mt-4">
                    <h2 className="text-3xl font-extrabold mb-8 text-slate-800">🗓 ประวัติการสอนย้อนหลัง</h2>
                    <div className="grid gap-5">
                        {[...sessions].reverse().map(session => (
                            <div key={session.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center hover:shadow-md cursor-pointer" onClick={() => onViewSession(session)}>
                                <div>
                                    <h3 className="text-xl font-bold text-slate-800">{session.subject} ({session.grade})</h3>
                                    <p className="text-sm text-slate-500">📅 {session.date} • 👥 {session.students.length} คน</p>
                                </div>
                                <div className="text-brandBlue font-bold">ดูสรุปผล ➔</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 6. Tracking View
        function TrackingView({ sessions }) {
            const [selectedStudent, setSelectedStudent] = useState('');
            const [searchTerm, setSearchTerm] = useState('');

            const allStudentsSet = new Set();
            sessions.forEach(s => s.students.forEach(st => allStudentsSet.add(st.name)));
            const uniqueStudents = Array.from(allStudentsSet).sort();

            const filteredList = uniqueStudents.filter(name => name.toLowerCase().includes(searchTerm.toLowerCase()));

            if (sessions.length === 0) {
                return <div className="text-center mt-20 text-slate-400"><h2 className="text-xl font-bold">ยังไม่มีประวัติการสอนเพื่อติดตามผู้เรียน</h2></div>;
            }

            let stats = null;
            if (selectedStudent) {
                let totalSessions = 0; let attendedSessions = 0; let totalScore = 0; let historyLog = [];
                sessions.forEach(session => {
                    const studentRecord = session.students.find(s => s.name === selectedStudent);
                    if (studentRecord) {
                        totalSessions++; if (studentRecord.attended) attendedSessions++; totalScore += studentRecord.score;
                        historyLog.push({ id: session.id, date: session.date, subject: session.subject, score: studentRecord.score, attended: studentRecord.attended, flagged: studentRecord.flagged, note: studentRecord.note });
                    }
                });
                historyLog.sort((a, b) => b.id - a.id);
                const attendanceRate = totalSessions > 0 ? Math.round((attendedSessions / totalSessions) * 100) : 0;
                const avgScore = totalSessions > 0 ? (totalScore / totalSessions).toFixed(1) : 0;
                stats = { totalSessions, attendedSessions, attendanceRate, avgScore, historyLog };
            }

            return (
                <div className="max-w-5xl mx-auto mt-4 bg-white p-8 md:p-10 rounded-[3rem] shadow-xl border border-slate-100">
                    <div className="flex items-center gap-4 mb-8 border-b pb-6">
                        <div className="p-4 bg-gradient-to-br from-purple-200 to-purple-400 rounded-3xl shadow-lg"><span className="text-4xl">📈</span></div>
                        <div>
                            <h2 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-brandPink">ระบบติดตามและวิเคราะห์ผู้เรียน</h2>
                            <p className="text-slate-500 font-medium">ดูพัฒนาการ พฤติกรรม และประวัติการเข้าเรียนรายบุคคล</p>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div className="md:col-span-1 bg-slate-50 p-5 rounded-3xl border border-slate-100 h-[60vh] flex flex-col">
                            <input type="text" placeholder="🔍 ค้นหาชื่อนักเรียน..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full p-3 mb-4 border-2 border-slate-200 rounded-xl outline-none focus:border-brandBlue" />
                            <div className="overflow-y-auto hide-scroll flex-1 space-y-2">
                                {filteredList.map(name => (
                                    <button key={name} onClick={() => setSelectedStudent(name)} className={`w-full text-left px-4 py-3 rounded-xl font-medium transition-colors ${selectedStudent === name ? 'bg-brandBlue text-white shadow-md' : 'bg-white text-slate-700 hover:bg-blue-50 border border-slate-100'}`}>{name}</button>
                                ))}
                            </div>
                        </div>
                        <div className="md:col-span-2">
                            {!selectedStudent ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 opacity-60"><span className="text-6xl mb-4">👈</span><p className="text-xl font-bold">เลือกชื่อนักเรียนจากรายการด้านซ้าย</p></div>
                            ) : (
                                <div>
                                    <h3 className="text-2xl font-bold text-slate-800 mb-6 border-l-4 border-brandBlue pl-4">{selectedStudent}</h3>
                                    <div className="grid grid-cols-3 gap-4 mb-8">
                                        <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl flex flex-col items-center justify-center text-center">
                                            <span className="text-emerald-500 text-sm font-bold mb-1">การเข้าเรียน</span><span className="text-3xl font-extrabold text-emerald-600">{stats.attendanceRate}%</span>
                                        </div>
                                        <div className="bg-blue-50 border border-blue-100 p-4 rounded-2xl flex flex-col items-center justify-center text-center">
                                            <span className="text-blue-500 text-sm font-bold mb-1">คะแนนเฉลี่ย</span><span className="text-3xl font-extrabold text-blue-600">{stats.avgScore}</span>
                                        </div>
                                        <div className="bg-orange-50 border border-orange-100 p-4 rounded-2xl flex flex-col items-center justify-center text-center">
                                            <span className="text-orange-500 text-sm font-bold mb-1">โดนปักหมุด</span><span className="text-3xl font-extrabold text-orange-600">{stats.historyLog.filter(l => l.flagged).length}</span>
                                        </div>
                                    </div>
                                    <h4 className="font-bold text-slate-600 mb-4">ประวัติการเรียน (ย้อนหลัง)</h4>
                                    <div className="space-y-3 max-h-[40vh] overflow-y-auto hide-scroll pr-2">
                                        {stats.historyLog.map(log => (
                                            <div key={log.id} className={`p-4 rounded-2xl border-2 ${log.flagged ? 'border-orange-300 bg-orange-50/30' : 'border-slate-100 bg-white'}`}>
                                                <div className="flex justify-between items-start mb-2">
                                                    <div><span className="font-bold text-slate-800">{log.subject}</span><span className="text-xs text-slate-400 ml-2">{log.date}</span></div>
                                                    <div className="font-extrabold text-brandBlue bg-blue-50 px-2 py-1 rounded-lg text-sm">{log.score} pt</div>
                                                </div>
                                                <div className="flex flex-wrap items-center gap-2 text-sm">
                                                    {log.attended ? <span className="text-emerald-500 font-medium">✅ เข้าเรียน</span> : <span className="text-red-400 font-medium">❌ ไม่ได้เช็คชื่อ</span>}
                                                    {log.flagged && <span className="bg-orange-100 text-orange-600 px-2 py-0.5 rounded font-bold text-xs">🚩 ถูกปักหมุด</span>}
                                                </div>
                                                {log.note && <div className="mt-3 text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 flex gap-2 items-start"><span className="text-blue-400">📝</span> <span className="italic">"{log.note}"</span></div>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body>
</html>
